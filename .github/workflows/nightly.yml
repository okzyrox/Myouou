# Testing artifacts for commits
# I do want to also do some tests as well at some point, but need to figure out setting up devkitPro env on here
name: Nightly

on:
  push:
    branches: [ "master" ]

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

env:
  BOOST_VERSION: 1.92.0
  SDL_VERSION: 3.4.20
  LDC_VERSION: 1.43.0

jobs:
  dynarmic:
    name: DynarmicNativeWrapper
    runs-on: windows-latest
    outputs:
      nightly: ${{ steps.name.outputs.nightly }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Nightly name
        id: name
        run: |
          nightly="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "NIGHTLY=$nightly" >> "$GITHUB_ENV"
          echo "nightly=$nightly" >> "$GITHUB_OUTPUT"

      # headers only
      - name: Cache Boost
        id: boost
        uses: actions/cache@v4
        with:
          path: Externals/boost/boost
          key: boost-${{ env.BOOST_VERSION }}

      - name: Download Boost
        if: steps.boost.outputs.cache-hit != 'true'
        run: |
          name="boost_${BOOST_VERSION//./_}"
          curl -fsSL -o boost.tar.gz "https://archives.boost.io/release/${BOOST_VERSION}/source/${name}.tar.gz"
          tar -xzf boost.tar.gz --strip-components=1 -C Externals/boost "${name}/boost"
          rm boost.tar.gz

      - name: Cache native build
        uses: actions/cache@v4
        with:
          path: Build/Release
          key: native-${{ hashFiles('.gitmodules', 'Source/Native/**') }}-${{ github.sha }}
          restore-keys: native-${{ hashFiles('.gitmodules', 'Source/Native/**') }}-
      
      # using msvc for now
      # may switch to something like clang since i use LDC and it just makes sense but shrug
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Library
        run: |
          cmake -S Source/Native -B Build/Release -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_C_COMPILER=cl -DCMAKE_CXX_COMPILER=cl
          cmake --build Build/Release --target DynarmicNativeWrapper

      - name: Upload
        run: |
          mkdir -p Package
          cp Bin/DynarmicNativeWrapper.dll Bin/DynarmicNativeWrapper.lib Bin/DynarmicNativeWrapper.exp Source/Native/DynarmicNativeWrapper.h Package/

      - uses: actions/upload-artifact@v4
        with:
          name: DynarmicNativeWrapper-win64-${{env.NIGHTLY}}
          path: Package/
          if-no-files-found: error

  myouou:
    name: Myouou
    needs: dynarmic
    runs-on: windows-latest
    env:
      NIGHTLY: ${{ needs.dynarmic.outputs.nightly }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: DynarmicNativeWrapper-${{env.NIGHTLY}}
          path: Bin

      - name: Download SDL3
        run: |
          curl -fsSL -o sdl.zip "https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/SDL3-devel-${SDL_VERSION}-VC.zip"
          unzip -q sdl.zip
          cp "SDL3-${SDL_VERSION}/lib/x64/SDL3.lib" "SDL3-${SDL_VERSION}/lib/x64/SDL3.dll" Bin/
          rm -rf sdl.zip "SDL3-${SDL_VERSION}"

      - uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-${{env.LDC_VERSION}}

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build Myouou
        run: dub build --arch=x86_64 --build=release

      - name: Upload
        run: |
          mkdir -p Package
          cp Bin/myouou.exe Bin/DynarmicNativeWrapper.dll Bin/SDL3.dll LICENSE.md readme.md Package/

      - uses: actions/upload-artifact@v4
        with:
          name: Myouou-${{env.NIGHTLY}}
          path: Package/
          if-no-files-found: error
